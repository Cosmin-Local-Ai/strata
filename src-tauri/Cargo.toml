[package]
name = "strata"
version = "0.1.0"
description = "Strata dock"
authors = ["Strata"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Pipes", "Win32_Storage_FileSystem",
  "Win32_System_IO", "Win32_Security", "Win32_System_Registry", "Win32_System_Com", "Win32_Graphics_Imaging", "Wdk_System_Threading", "Win32_UI_Accessibility", "Win32_System_RemoteDesktop", "Win32_System_Kernel", "Media_Control", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_NetworkManagement_WiFi", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Globalization", "Win32_UI_TextServices", "Win32_System_LibraryLoader", "Win32_Security_Credentials", "Win32_Storage_EnhancedStorage", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_NetworkListManager", "Win32_System_Shutdown", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_Devices_Display", "Devices_Radios", "Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_UI_ColorSystem", "Security_Credentials_UI",
] }
tauri-plugin-single-instance = "2"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
imap = "2.4"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk", "network"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
windows-future = "0.3"
